name: meetgo
services:

  app:
    build: app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/meetgo
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-me
      DEBUG_COMPOSE_LOGS: "1"
      COMPOSE_PROJECT_NAME: meetgo
    ports:
      - "18000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ${REPO_DIR}/app/src:/app/src
      - ${REPO_DIR}/lang:/app/lang
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped


  web_user:
    build: ${REPO_DIR}/web
    ports:
      - "${PORT_USER}:${PORT_USER}"
    depends_on:
      - app
    environment:
      VITE_API_BASE: https://api.meetgo.app
      VITE_ROOT: /app/web_user
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ${REPO_DIR}/web:/app
      - ${REPO_DIR}/lang:/app/lang
      - /app/node_modules
    command: sh -c "npx vite --config /app/vite.config.ts --host 0.0.0.0 --port ${PORT_USER} 2>&1 | awk '{ print strftime(\"%Y-%m-%dT%H:%M:%S%z\"), $0; fflush(); }'"
    restart: unless-stopped


  web_admin:
    build: ${REPO_DIR}/web
    ports:
      - "${PORT_ADMIN}:${PORT_ADMIN}"
    depends_on:
      - app
    environment:
      VITE_API_BASE: https://api.meetgo.app
      VITE_ROOT: /app/web_admin
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ${REPO_DIR}/web:/app
      - ${REPO_DIR}/lang:/app/lang
      - /app/node_modules
    command: sh -c "npx vite --config /app/vite.config.ts --host 0.0.0.0 --port ${PORT_ADMIN} 2>&1 | awk '{ print strftime(\"%Y-%m-%dT%H:%M:%S%z\"), $0; fflush(); }'"
    restart: unless-stopped


  db:
    image: postgres:16
    environment:
      POSTGRES_DB: meetgo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    #ports:
    #  - "5432:5432"
    volumes:
      - meetgo_db:/var/lib/postgresql/data
    restart: unless-stopped


  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  meetgo_db:
