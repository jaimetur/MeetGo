services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: meetgo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    #ports:
    #  - "5432:5432"
    volumes:
      - meetgo_db:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/meetgo
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-me
    ports:
      - "18000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE: http://192.168.1.11:18000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
  

volumes:
  meetgo_db:
