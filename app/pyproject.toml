[project]
name = "meetgo-backend"
version = "0.2.0"
description = "MeetGo backend: rooms, moderated chat, DMs, profiles, friends, following, feed"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "SQLAlchemy==2.0.36",
  "asyncpg==0.30.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==3.2.2",
  "redis==5.2.0",
  "docker==7.1.0",
]
