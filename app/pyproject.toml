[project]
name = "meetgo-backend"
version = "0.2.0"
description = "MeetGo backend: rooms, moderated chat, DMs, profiles, friends, following, feed"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "SQLAlchemy==2.0.36",
  "greenlet==3.5.5",
  "asyncpg==0.30.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==3.2.2",
  "redis==5.2.0",
  "docker==7.1.0",
  "httpx==0.28.1",
  "alembic==1.14.0",
  "python-multipart==0.0.20",
  "Pillow==11.0.0",
  "pywebpush==2.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
