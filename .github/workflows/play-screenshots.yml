name: 📸 Play screenshots

# Takes the Google Play store screenshots again, in every language and for every device Play asks for (phone, 7" and
# 10" tablet, Chromebook), from a demo account with made-up content in each language (app.demo.play_review --lang).
# tools/play_screenshots.py does it.
# - On every push to a release branch (X.Y.Z, not main) that changes what they show (the web app, the demo content,
#   the translations or the tool), and by hand (Actions → Play screenshots → Run workflow): the images are committed to
#   that same branch in assets/play-store/<device>/<lang>/ and, if the PLAY_SERVICE_ACCOUNT_JSON secret exists, sent to
#   the Play listing in each language, with the listing's texts in assets/play-store/listings/ (tools/play_listing.py).
# - On a release (vX.Y.Z tag): they are attached to the release as play-screenshots.zip.
on:
  push:
    # not main: there the bot would commit screenshots, and main must only move forward from the release branch
    branches: ["[0-9]+.[0-9]+.[0-9]+"]
    tags: ["v*"]
    paths:
      - "src/frontend/**"
      - "src/backend/app/demo/**"
      - "lang/**"
      - "tools/play_screenshots.py"
      - "tools/play_listing.py"
      - "assets/play-store/listings/**"
      - ".github/workflows/play-screenshots.yml"
  workflow_dispatch:

# one at a time per branch: a newer push waits for the run in progress (which also sends the Play listing) instead of
# cancelling it; only the latest waiting one is kept
concurrency:
  group: meetgo-play-screenshots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: play
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Tools (backend, frontend, Playwright, fonts for every language)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-color-emoji fonts-noto-cjk
          pip install -q -e ".[screens]"
          python -m playwright install --with-deps chromium
          (cd src/frontend && npm ci --silent)
      - name: Screenshots
        run: python tools/play_screenshots.py --pg postgresql://postgres:play@127.0.0.1:5432 --redis redis://127.0.0.1:6379/0
      - name: Commit them to the same branch
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/play-store
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Play screenshots taken again [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
      # a failure turns the run red (the screenshots are already committed by then)
      - name: Send them to the Play listing (if the PLAY_SERVICE_ACCOUNT_JSON secret exists)
        if: github.ref_type == 'branch'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "No PLAY_SERVICE_ACCOUNT_JSON: the listing is not updated."; exit 0; fi
          pip install -q google-api-python-client google-auth
          python tools/play_listing.py
      - name: Attach them to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd assets && zip -qr "$RUNNER_TEMP/play-screenshots.zip" play-store)
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/play-screenshots.zip" --clobber
