server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed build files never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker and manifest must always be fresh.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /app.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # Android App Links: the API builds this file from ANDROID_CERT_SHA256.
  location = /.well-known/assetlinks.json {
    proxy_pass http://app:8000/.well-known/assetlinks.json;
  }

  # The landing page is at "/" in every project: old /landing links redirect there.
  location ~ ^/landing/?$ { return 301 /; }

  # The messaging app is a single-page app under /app/.
  location /app/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /app/index.html;
  }

  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }
}
